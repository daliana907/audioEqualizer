name = audioEqualizer
summary = Audio Equalizer
description = """Ecualizador de audio de 31 bandas para NVDA con perfiles, control de graves y agudos, balance, efectos estéreo y filtros para auriculares. Requiere Equalizer APO."""
author = "Daliana <daliana907@github.com>"
url = https://github.com/daliana907/audioEqualizer
version = 1.2.0
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.2
updateChannel = None
changelog = """Versión 1.2.0:
- Seguridad: detección de pantallas seguras de Windows (secureMode) para anular la carga del plugin en entornos protegidos (UAC, pantalla de bloqueo e inicio de sesión).
- Atajos sin asignar por defecto: todos los ~31 comandos se dejan sin atajos asignados de fábrica para evitar colisiones con otros complementos (como NVDA+Shift+E de Monitoreo del Sistema). Pueden asignarse libremente desde Gestos de entrada de NVDA.
- Integración oficial con la API gui.openDocumentation() de NVDA para abrir la ayuda con control de errores.
- Encabezados de licencia oficial GPLv2 y copyright de Daliana añadidos a todos los módulos.
- Tareas de instalación y desinstalación limpias en installTasks.py para eliminar configuraciones huérfanas al desinstalar.
- Soporte completo de localización bilingüe en español e inglés con catálogos .po y .mo compilados.
- Enlace directo de descarga al archivo .nvda-addon en README y documentación."""
