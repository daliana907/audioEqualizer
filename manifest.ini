name = audioEqualizer
summary = Audio Equalizer
description = """Ecualizador de audio de 31 bandas para NVDA con perfiles, control de graves y agudos, balance, efectos estéreo y filtros para auriculares. Requiere Equalizer APO."""
author = Daliana
url = https://github.com/daliana907/audioEqualizer
version = 1.6.4
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.2
updateChannel = None
changelog = """Versión 1.6.4:
- Canales y sonido envolvente: nueva lista de configuración de canales (estéreo, 5.1, 7.1, cuadrafónico y mezclas inteligentes a estéreo) con niveles de canal central, subwoofer y traseros.
- Ancho estéreo: la mezcla usa la sintaxis que entiende el motor de sonido, verificada con su herramienta oficial de prueba.
- Perfiles con ancho en valor normal (100) y valores guardados normalizados.
- En estéreo, los niveles de central y subwoofer actúan como realce de voces y de graves; el nivel de traseros necesita contenido multicanal.
- Registro honesto: informa el estado real de los efectos de canales.

Versión 1.6.3:
- Prevención de saltos de foco y auto-apertura del menú: asignación del mnemónico único 'Ecualizador de &Audio' (tecla A) en el menú Herramientas, eliminando la colisión con la letra E y el despliegue automático involuntario al navegar con el teclado.
- Corrección de lectura en nvda.ini: resolución del fallo interno de desempaquetado de diccionario al leer AggregatedSection de NVDA en el arranque, garantizando la carga fidedigna del estado guardado.
- Limpieza preventiva de submenús al recargar complementos sin reiniciar NVDA.

Versión 1.6.2:
- Estabilidad de menús: corrección y blindaje del ciclo de vida del submenú en el menú Herramientas de NVDA, garantizando la desvinculación limpia de eventos (Unbind) y eliminación segura al reiniciar o recargar complementos.
- Prevención de activaciones involuntarias: asignación de texto de ayuda accesible y gestión precisa de identificadores para evitar saltos de foco o aperturas accidentales en la barra de tareas.

Versión 1.6.1:
- Persistencia indestructible del ecualizador: corrección definitiva del fallo que provocaba que el ecualizador amaneciera apagado o se reseteara a perfil "sin personalizar" al reiniciar NVDA o el equipo.
- Doble capa de almacenamiento seguro: guardado síncrono inmediato en nvda.ini (forzando config.conf.save()) complementado con archivo de respaldo atómico JSON tolerante a cierres abruptos o reinicios con NVDA+Control+F3.
- Blindaje del cargador de configuración: soporte resiliente de listas de ganancias serializadas como cadenas por ConfigObj, evitando excepciones internas silenciosas que reiniciaban los parámetros acústicos a valores de fábrica.
- Botón "Aplicar" con guardado persistente: al pulsar Aplicar en la ventana de ajustes, la configuración se consolida inmediatamente en disco.
- Restauración automática de personalizaciones sobre perfiles de fábrica al iniciar NVDA.
- Desinstalación limpia: eliminación completa de archivos de estado persistente residuales.

Versión 1.6.0:
- Corrección de compatibilidad en Windows 10 y 11: resolución integral de excepciones por atributos y argumentos no reconocidos ('surround_3d', 'radar_mode') en la inicialización y clonación de perfiles.
- Registro técnico y auditoría resiliente: función write_audit_log blindada contra argumentos futuros y enriquecida con diagnóstico en tiempo real de Efecto 3D Espacial (Haas) y Modo Radar Posicional.
- Interfaz gráfica ampliada: nueva casilla para conmutar el Efecto 3D Espacial en la ventana de configuración y nuevos atajos de teclado reasignables.
- Descarga segura de Equalizer APO: conexión cifrada con contexto SSL explícito y validado en Python 3.12+ para evitar fallos de certificados en Windows 11.
- Corrección de anulaciones de fábrica (factory overrides): resolución de UnboundLocalError y compatibilidad garantizada en perfiles seguros y entornos de ejecución aislados.
- Desinstalación limpia: eliminación automática de archivos de sobreescritura de fábrica y temporales residuales.
- Pasaje automático a perfil Personalizado al ajustar cualquier control acústico o espacial.

Versión 1.5.1:
- Filtrado robusto al cargar perfiles JSON de usuario y borrar archivos temporales de prueba.

Versión 1.5.0:
- Optimización completa de perfiles predefinidos: cada perfil incluye ahora calibración específica en sus deslizadores de graves y agudos rápidos y activación coherente de sus filtros acústicos especializados (subgraves en Electrónica y Más graves, claridad y expansión de escena en Películas y Juegos, filtro anti-zumbido y voz en Podcasts, y compensación isofónica Loudness en Modo nocturno y Clásica).
- Sincronización inteligente de la ventana de configuración: al modificar los controles de tono rápido, el ancho estéreo o cualquiera de las casillas de mejoras acústicas, la lista pasa automáticamente al modo Personalizado para que ningún ajuste manual se pierda ni se sobrescriba.
- Corrección de valores acústicos: todos los perfiles de fábrica definen de forma explícita todos sus parámetros acústicos, garantizando transiciones limpias y sin valores residuales al alternar entre ellos.
Versión 1.4.0:
- Corrección en la descarga de Equalizer APO desde el asistente del menú.
- Respeto a configuraciones existentes de sonido al vincular Equalizer APO.
- Activación automática de preamplificación de seguridad en perfiles de fábrica.
- Mayor fluidez en la respuesta de las barras deslizantes.
- Sincronización precisa de perfiles al alternar con atajo de teclado.
- Filtro contra zumbido eléctrico ampliado para atenuar armónicos secundarios.
- Descarga de Equalizer APO actualizada a la versión 1.4.2.
Versión 1.3.1:
- Complemento más ligero al eliminar dependencias internas que no se utilizaban en 5 módulos.
- Documentación técnica interna completa de los controles de ajustes, el diálogo de descarga, los perfiles de sonido y el generador de tonos.
Versión 1.3.0:
- Corrección en el ensanchamiento estéreo: al superar el 100 %, el audio ahora se expande equilibradamente en ambos auriculares sin perder el canal izquierdo.
- Protección automática contra distorsión y saturación digital (preamp automático) mediante cálculo combinado de refuerzos en graves y agudos.
- Al retocar una frecuencia en un perfil personalizado propio, el selector mantiene tu perfil activo en lugar de saltar al genérico.
- Mayor estabilidad al guardar o eliminar perfiles acústicos y limpieza completa de archivos temporales al desinstalar.
- Mejoras generales de rendimiento, manejo de memoria y robustez en la comunicación con el motor de audio.
Versión 1.2.0:
- Seguridad: detección de pantallas seguras de Windows (secureMode) para anular la carga del plugin en entornos protegidos (UAC, pantalla de bloqueo e inicio de sesión).
- Atajos sin asignar por defecto: todos los ~31 comandos se dejan sin atajos asignados de fábrica para evitar colisiones con otros complementos (como NVDA+Shift+E de Monitoreo del Sistema). Pueden asignarse libremente desde Gestos de entrada de NVDA.
- Integración oficial con la API gui.openDocumentation() de NVDA para abrir la ayuda con control de errores.
- Encabezados de licencia oficial GPLv2 y copyright de Daliana añadidos a todos los módulos.
- Tareas de instalación y desinstalación limpias en installTasks.py para eliminar configuraciones huérfanas al desinstalar.
- Soporte completo de localización bilingüe en español e inglés con catálogos .po y .mo compilados.
- Enlace directo de descarga al archivo .nvda-addon en README y documentación."""

